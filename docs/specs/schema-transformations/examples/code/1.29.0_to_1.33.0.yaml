# Code attributes: pre-stability (v1.29.0) -> stable (v1.33.0), spans and logs.
#
# Based on docs/non-normative/code-attrs-migration.md. Code attributes are
# defined on spans and log records; no semconv metric uses them, so there are
# no metric policies. Each rename needs its own policy per signal because a
# record can carry any subset of the keys, and the only matcher is `exists`
# on the renamed key (self-guarded, so it doesn't split partitions).
#
# Left out:
#   - v1.30.0 producers already emit code.function.name (short name); it
#     passes through unchanged.
file_format: transform/2.0
source:
  schema_url: https://opentelemetry.io/schemas/1.29.0
target:
  schema_url: https://opentelemetry.io/schemas/1.33.0

policies:
  # --- Spans ----------------------------------------------------------------
  - id: code-span-lineno
    name: code.lineno becomes code.line.number on spans
    description: >
      Renamed in 1.30.0, same type (int) and meaning. Target data has no
      code.lineno, so the rule doesn't touch it. With code/dup emission the
      existing code.line.number wins (upsert false) and code.lineno is dropped.
    trace_transform:
      matches:
        - target: {span_attribute: [code.lineno]}
          predicate: {exists: {}}
      rename:
        - {from: {span_attribute: [code.lineno]}, to: code.line.number}

  - id: code-span-column
    name: code.column becomes code.column.number on spans
    description: Renamed in 1.30.0, same type (int) and meaning.
    trace_transform:
      matches:
        - target: {span_attribute: [code.column]}
          predicate: {exists: {}}
      rename:
        - {from: {span_attribute: [code.column]}, to: code.column.number}

  - id: code-span-filepath
    name: code.filepath becomes code.file.path on spans
    description: Renamed in 1.30.0, same type (string) and meaning.
    trace_transform:
      matches:
        - target: {span_attribute: [code.filepath]}
          predicate: {exists: {}}
      rename:
        - {from: {span_attribute: [code.filepath]}, to: code.file.path}

  # --- Logs -----------------------------------------------------------------
  - id: code-log-lineno
    name: code.lineno becomes code.line.number on log records
    description: Renamed in 1.30.0, same type (int) and meaning.
    log_transform:
      matches:
        - target: {log_attribute: [code.lineno]}
          predicate: {exists: {}}
      rename:
        - {from: {log_attribute: [code.lineno]}, to: code.line.number}

  - id: code-log-column
    name: code.column becomes code.column.number on log records
    description: Renamed in 1.30.0, same type (int) and meaning.
    log_transform:
      matches:
        - target: {log_attribute: [code.column]}
          predicate: {exists: {}}
      rename:
        - {from: {log_attribute: [code.column]}, to: code.column.number}

  - id: code-log-filepath
    name: code.filepath becomes code.file.path on log records
    description: Renamed in 1.30.0, same type (string) and meaning.
    log_transform:
      matches:
        - target: {log_attribute: [code.filepath]}
          predicate: {exists: {}}
      rename:
        - {from: {log_attribute: [code.filepath]}, to: code.file.path}

  - id: code-span-function
    name: code.namespace and code.function joined into code.function.name on spans (approximate)
    description: >
      Approximate: joins with "." while some languages use another separator
      (e.g. "::"). A missing code.namespace leaves the short name.
      `discard` drops code.namespace after `add` reads it. Records that
      already carry code.function.name are left alone.
    trace_transform:
      matches:
        - target: {span_attribute: [code.function]}
          predicate: {exists: {}}
        - target: {span_attribute: [code.function.name]}
          predicate: {exists: {}}
          negate: true
      rename: [{from: {span_attribute: [code.function]}, to: code.function.name}]
      add:
        - target: {span_attribute: [code.function.name]}
          from: [{span_attribute: [code.namespace]}, {span_attribute: [code.function.name]}]
          separator: "."
          upsert: true
      discard: [{target: {span_attribute: [code.namespace]}}]

  - id: code-log-function
    name: code.namespace and code.function joined into code.function.name on log records (approximate)
    description: >
      Approximate: joins with "." while some languages use another separator
      (e.g. "::"). A missing code.namespace leaves the short name.
      `discard` drops code.namespace after `add` reads it. Records that
      already carry code.function.name are left alone.
    log_transform:
      matches:
        - target: {log_attribute: [code.function]}
          predicate: {exists: {}}
        - target: {log_attribute: [code.function.name]}
          predicate: {exists: {}}
          negate: true
      rename: [{from: {log_attribute: [code.function]}, to: code.function.name}]
      add:
        - target: {log_attribute: [code.function.name]}
          from: [{log_attribute: [code.namespace]}, {log_attribute: [code.function.name]}]
          separator: "."
          upsert: true
      discard: [{target: {log_attribute: [code.namespace]}}]
