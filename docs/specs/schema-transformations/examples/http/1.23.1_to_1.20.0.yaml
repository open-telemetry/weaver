# HTTP stable -> pre-stability migration (v1.23.1 -> v1.20.0), spans and
# duration metrics. Lets dashboards written against 1.20 also see data from
# stable producers.
#
# Source: the HTTP migration guide,
# https://github.com/open-telemetry/semantic-conventions/blob/main/docs/non-normative/http-migration.md
# Written on its own, not inverted from 1.20.0_to_1.23.1.yaml.
#
# Not expressible here:
#   - url.path + url.query -> http.target (concatenation)
#   - http.request.header.<key> / http.response.header.<key> key normalization
#   - span names (HTTP -> {method} for _OTHER)
# Not bridgeable (data the stable side doesn't carry):
#   - the original method on metrics when http.request.method is _OTHER
#   - net.sock.family, net.sock.peer.name, net.sock.peer.addr on
#     http.client.duration, net.host.name/port on the server metric (Opt-In
#     in stable)
# Extra in source, ignored (old queries don't reference them):
#   error.type, client.port, network.transport, url.scheme on client
#   spans/metrics.
file_format: transform/2.0
source:
  schema_url: https://opentelemetry.io/schemas/1.23.1
target:
  schema_url: https://opentelemetry.io/schemas/1.20.0

policies:
  # ===================================================================
  # Spans (stable shape: http.request.method is Required)
  # ===================================================================
  - id: http-span-common-rev
    name: Stable HTTP span attributes common to client and server renamed back
    description: >-
      http.request.method=_OTHER with http.request.method_original is handled
      by http-span-method-other-rev (its remove runs before this rename).
      network.protocol.version "2"/"3" are fixed by
      http-span-protocol-version-*-rev.
    trace:
      matches:
        - {span_attribute: [http.request.method], exists: true}
      transform:
        rename:
          - {span_attribute: [http.request.method], to: http.method}
          - {span_attribute: [http.response.status_code], to: http.status_code}
          - {span_attribute: [http.request.body.size], to: http.request_content_length}
          - {span_attribute: [http.response.body.size], to: http.response_content_length}
          - {span_attribute: [network.protocol.name], to: net.protocol.name}
          - {span_attribute: [network.protocol.version], to: net.protocol.version}
          - {span_attribute: [network.peer.address], to: net.sock.peer.addr}
          - {span_attribute: [network.peer.port], to: net.sock.peer.port}

  - id: http-span-method-other-rev
    name: http.request.method=_OTHER takes http.method from http.request.method_original
    trace:
      matches:
        - {span_attribute: [http.request.method], equals: _OTHER}
        - {span_attribute: [http.request.method_original], exists: true}
      transform:
        remove:
          - {span_attribute: [http.request.method]}
        rename:
          - {span_attribute: [http.request.method_original], to: http.method}

  - id: http-span-protocol-version-2-rev
    name: network.protocol.version "2" becomes net.protocol.version "2.0"
    description: Assumes 1.20 producers reported HTTP/2 as "2.0" (the 1.20 examples); see README.md.
    trace:
      matches:
        - {span_attribute: [http.request.method], exists: true}
        - {span_attribute: [network.protocol.version], equals: "2"}
      transform:
        remove:
          - {span_attribute: [network.protocol.version]}
        add:
          - {span_attribute: [net.protocol.version], value: "2.0"}

  - id: http-span-protocol-version-3-rev
    name: network.protocol.version "3" becomes net.protocol.version "3.0"
    trace:
      matches:
        - {span_attribute: [http.request.method], exists: true}
        - {span_attribute: [network.protocol.version], equals: "3"}
      transform:
        remove:
          - {span_attribute: [network.protocol.version]}
        add:
          - {span_attribute: [net.protocol.version], value: "3.0"}

  - id: http-span-protocol-name-rev
    name: Absent network.protocol.name with a version set means http
    description: >-
      Stable requires network.protocol.name only when it isn't http and a
      version is set, so absence + version means http. 1.20 recommended
      net.protocol.name always.
    trace:
      matches:
        - {span_attribute: [http.request.method], exists: true}
        - {span_attribute: [network.protocol.name], exists: false}
        - {span_attribute: [network.protocol.version], exists: true}
      transform:
        add:
          - {span_attribute: [net.protocol.name], value: http}

  - id: http-span-client-rev
    name: Stable HTTP client span attributes renamed back
    trace:
      matches:
        - {span_kind: client}
        - {span_attribute: [http.request.method], exists: true}
      transform:
        rename:
          - {span_attribute: [url.full], to: http.url}
          - {span_attribute: [http.request.resend_count], to: http.resend_count}
          - {span_attribute: [server.address], to: net.peer.name}
          - {span_attribute: [server.port], to: net.peer.port}

  - id: http-span-server-rev
    name: Stable HTTP server span attributes renamed back
    description: >-
      client.address falls back to the peer address in stable, so
      http.client_ip is also set when there was no forwarding header (1.20
      left it unset). url.path/url.query can't be joined into http.target.
    trace:
      matches:
        - {span_kind: server}
        - {span_attribute: [http.request.method], exists: true}
      transform:
        rename:
          - {span_attribute: [url.scheme], to: http.scheme}
          - {span_attribute: [client.address], to: http.client_ip}
          - {span_attribute: [server.address], to: net.host.name}
          - {span_attribute: [server.port], to: net.host.port}
          - {span_attribute: [network.local.address], to: net.sock.host.addr}
          - {span_attribute: [network.local.port], to: net.sock.host.port}

  # ===================================================================
  # Metrics
  # ===================================================================
  - id: http-server-request-duration-rev
    name: http.server.request.duration (s) becomes http.server.duration (ms)
    description: >-
      _OTHER is kept as http.method="_OTHER"; the original method isn't on
      metrics. Only 1.20 data is target-shaped: 1.21 producers also emit
      http.server.duration, but in s.
    metric:
      matches:
        - {metric_field: name, equals: http.server.request.duration}
      transform:
        rename:
          - {datapoint_attribute: [http.request.method], to: http.method}
          - {datapoint_attribute: [http.response.status_code], to: http.status_code}
          - {datapoint_attribute: [url.scheme], to: http.scheme}
          - {datapoint_attribute: [network.protocol.name], to: net.protocol.name}
          - {datapoint_attribute: [network.protocol.version], to: net.protocol.version}
          - {datapoint_attribute: [server.address], to: net.host.name}
          - {datapoint_attribute: [server.port], to: net.host.port}
        add:
          - {metric_field: name, value: http.server.duration, upsert: true}

  - id: http-server-request-duration-rev-view
    name: http.server.request.duration unit s -> ms (view for http-server-request-duration-rev)
    metric_view:
      matches:
        - {metric_field: name, equals: http.server.request.duration}
      view:
        scale: [{metric_field: unit, from: s, to: ms}]

  - id: http-server-request-duration-protocol-version-2-rev
    name: network.protocol.version "2" on http.server.request.duration becomes "2.0"
    metric:
      matches:
        - {metric_field: name, equals: http.server.request.duration}
        - {datapoint_attribute: [network.protocol.version], equals: "2"}
      transform:
        add:
          - {datapoint_attribute: [net.protocol.version], value: "2.0", upsert: true}

  - id: http-server-request-duration-protocol-version-3-rev
    name: network.protocol.version "3" on http.server.request.duration becomes "3.0"
    metric:
      matches:
        - {metric_field: name, equals: http.server.request.duration}
        - {datapoint_attribute: [network.protocol.version], equals: "3"}
      transform:
        add:
          - {datapoint_attribute: [net.protocol.version], value: "3.0", upsert: true}

  - id: http-server-request-duration-protocol-name-rev
    name: Absent network.protocol.name with a version on http.server.request.duration means http
    metric:
      matches:
        - {metric_field: name, equals: http.server.request.duration}
        - {datapoint_attribute: [network.protocol.name], exists: false}
        - {datapoint_attribute: [network.protocol.version], exists: true}
      transform:
        add:
          - {datapoint_attribute: [net.protocol.name], value: http}

  - id: http-client-request-duration-rev
    name: http.client.request.duration (s) becomes http.client.duration (ms)
    metric:
      matches:
        - {metric_field: name, equals: http.client.request.duration}
      transform:
        rename:
          - {datapoint_attribute: [http.request.method], to: http.method}
          - {datapoint_attribute: [http.response.status_code], to: http.status_code}
          - {datapoint_attribute: [server.address], to: net.peer.name}
          - {datapoint_attribute: [server.port], to: net.peer.port}
          - {datapoint_attribute: [network.protocol.name], to: net.protocol.name}
          - {datapoint_attribute: [network.protocol.version], to: net.protocol.version}
        add:
          - {metric_field: name, value: http.client.duration, upsert: true}

  - id: http-client-request-duration-rev-view
    name: http.client.request.duration unit s -> ms (view for http-client-request-duration-rev)
    metric_view:
      matches:
        - {metric_field: name, equals: http.client.request.duration}
      view:
        scale: [{metric_field: unit, from: s, to: ms}]

  - id: http-client-request-duration-protocol-version-2-rev
    name: network.protocol.version "2" on http.client.request.duration becomes "2.0"
    metric:
      matches:
        - {metric_field: name, equals: http.client.request.duration}
        - {datapoint_attribute: [network.protocol.version], equals: "2"}
      transform:
        add:
          - {datapoint_attribute: [net.protocol.version], value: "2.0", upsert: true}

  - id: http-client-request-duration-protocol-version-3-rev
    name: network.protocol.version "3" on http.client.request.duration becomes "3.0"
    metric:
      matches:
        - {metric_field: name, equals: http.client.request.duration}
        - {datapoint_attribute: [network.protocol.version], equals: "3"}
      transform:
        add:
          - {datapoint_attribute: [net.protocol.version], value: "3.0", upsert: true}

  - id: http-client-request-duration-protocol-name-rev
    name: Absent network.protocol.name with a version on http.client.request.duration means http
    metric:
      matches:
        - {metric_field: name, equals: http.client.request.duration}
        - {datapoint_attribute: [network.protocol.name], exists: false}
        - {datapoint_attribute: [network.protocol.version], exists: true}
      transform:
        add:
          - {datapoint_attribute: [net.protocol.name], value: http}
