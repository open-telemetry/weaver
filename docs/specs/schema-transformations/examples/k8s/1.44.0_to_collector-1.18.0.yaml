      matches: [{metric_field: name, equals: k8s.resourcequota.memory.limit.hard}]
      transform:
        add:
          - {metric_field: name, value: k8s.resource_quota.hard_limit, upsert: true}
          - {datapoint_attribute: [resource], value: limits.memory}

