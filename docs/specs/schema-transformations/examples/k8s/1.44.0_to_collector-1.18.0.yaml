  - id: rev-container-page-faults-view
    name: system.paging.fault.type dropped from container.paging.faults (view for rev-container-page-faults)
    metric_view:
      matches: [{metric_field: name, equals: container.paging.faults}]
      view:
        drop_attributes: [{datapoint_attribute: [system.paging.fault.type]}]

  # --- Namespace phase: same name, different shape --------------------------
  # Old: one series per namespace, 1 = active, 0 = terminating, no phase
  # attribute. Stable: k8s.namespace.phase{k8s.namespace.phase=<phase>}.
  # Both policies require the phase attribute, which old data never has, so
  # they leave old-shaped data unchanged.
  - id: rev-k8s-namespace-phase-active-view
    name: k8s.namespace.phase{phase=active} becomes the old value-encoded k8s.namespace.phase
    description: >
      The active series is 1 for an active namespace and 0 otherwise, which is
      the old encoding. Caveats: semconv doesn't require producers to emit the
      0-valued series, so terminating namespaces may be missing instead of 0;
      the old -1 (unknown phase) can't be produced.
    metric_view:
      matches:
        - {metric_field: name, equals: k8s.namespace.phase}
        - {datapoint_attribute: [k8s.namespace.phase], equals: active}
      view:
        drop_attributes: [{datapoint_attribute: [k8s.namespace.phase]}]

  - id: rev-k8s-namespace-phase-drop-other
    name: k8s.namespace.phase series for other phases are dropped
    metric:
      matches:
        - {metric_field: name, equals: k8s.namespace.phase}
        - {datapoint_attribute: [k8s.namespace.phase], exists: true}
        - {datapoint_attribute: [k8s.namespace.phase], equals: active, negate: true}
      keep: false

