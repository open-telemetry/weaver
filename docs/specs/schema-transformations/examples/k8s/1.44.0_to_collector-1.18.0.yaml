  # --- Paging faults: all fault types sum to the old total ------------------
  # semconv: minor = PageFaults - MajorPageFaults, so summing over
  # system.paging.fault.type gives the old *.memory.page_faults (PageFaults).
  - id: rev-k8s-pod-page-faults
    name: k8s.pod.paging.faults summed over fault type becomes k8s.pod.memory.page_faults
    metric:
      matches: [{metric_field: name, equals: k8s.pod.paging.faults}]
      transform:
        add: [{metric_field: name, value: k8s.pod.memory.page_faults, upsert: true}]

  - id: rev-k8s-pod-page-faults-view
    name: system.paging.fault.type dropped from k8s.pod.paging.faults (view for rev-k8s-pod-page-faults)
    metric_view:
      matches: [{metric_field: name, equals: k8s.pod.paging.faults}]
      view:
        drop_attributes: [{datapoint_attribute: [system.paging.fault.type]}]

  - id: rev-k8s-node-page-faults
    name: k8s.node.paging.faults summed over fault type becomes k8s.node.memory.page_faults
