# K8s migration: semantic conventions v1.44.0 -> pre-stability (Collector
# k8scluster / kubeletstats / k8sattributes) conventions.
#
# Lets dashboards written against the Collector's old names also see data
# from producers that emit the stable K8s conventions. Written independently
# of collector-1.18.0_to_1.44.0.yaml (not a mechanical inversion).
#
# Not bridgeable / not expressible in this direction (see README.md):
#   - *.limit.current / *.request.current, k8s.pod.cpu.*: no old equivalent
#     (extra in source, ignored)
#   - k8s.{pod,node}.memory.major_page_faults and container.memory.major_page_faults:
#     the major partition of *.paging.faults already feeds the old total
#     *.memory.page_faults; a record can't be copied to two metrics
#   - k8s.node.condition_*, k8s.pod.phase, k8s.pod.status_reason: the old
#     value encodes the state (needs attribute -> value derivation)
#   - ResourceQuota CPU (cores -> millicores, no unit for millicores),
#     hugepages and per-storage-class keys (derived keys)
#   - k8s.{pod,node,namespace}.label(s)/annotation(s).<key>: templated keys
#   - instrument changes updowncounter -> gauge (Prometheus exports both as
#     gauges)
file_format: transform/2.0
source:
  schema_url: https://opentelemetry.io/schemas/1.44.0
target:
  schema_url: https://opentelemetry.io/schemas/1.18.0

policies:
  # --- Network metrics: attribute renames back, same metric name ------------
  - id: rev-k8s-pod-network-io-attrs
    name: k8s.pod.network.io attributes renamed back to interface/direction
    description: >
      Target-safe: old records carry `interface` / `direction` and never the
      network.* keys.
    metric:
      matches: [{metric_field: name, equals: k8s.pod.network.io}]
      transform:
        rename:
          - {datapoint_attribute: [network.interface.name], to: interface}
          - {datapoint_attribute: [network.io.direction], to: direction}

  - id: rev-k8s-pod-network-errors-attrs
    name: k8s.pod.network.errors attributes renamed back to interface/direction
    metric:
      matches: [{metric_field: name, equals: k8s.pod.network.errors}]
      transform:
        rename:
          - {datapoint_attribute: [network.interface.name], to: interface}
          - {datapoint_attribute: [network.io.direction], to: direction}

  - id: rev-k8s-node-network-io-attrs
    name: k8s.node.network.io attributes renamed back to interface/direction
    metric:
      matches: [{metric_field: name, equals: k8s.node.network.io}]
      transform:
        rename:
          - {datapoint_attribute: [network.interface.name], to: interface}
          - {datapoint_attribute: [network.io.direction], to: direction}

  - id: rev-k8s-node-network-errors-attrs
    name: k8s.node.network.errors attributes renamed back to interface/direction
    metric:
      matches: [{metric_field: name, equals: k8s.node.network.errors}]
      transform:
        rename:
          - {datapoint_attribute: [network.interface.name], to: interface}
          - {datapoint_attribute: [network.io.direction], to: direction}

