  - id: grpc-client-call-duration-error-aborted
    name: grpc.client.call.duration with grpc.status ABORTED gets error.type ABORTED
    metric:
      matches:
        - {metric_field: name, equals: grpc.client.call.duration}
        - {datapoint_attribute: [grpc.status], equals: ABORTED}
      transform:
        add: [{datapoint_attribute: [error.type], value: ABORTED}]
  - id: grpc-client-call-duration-error-out-of-range
    name: grpc.client.call.duration with grpc.status OUT_OF_RANGE gets error.type OUT_OF_RANGE
    metric:
      matches:
        - {metric_field: name, equals: grpc.client.call.duration}
        - {datapoint_attribute: [grpc.status], equals: OUT_OF_RANGE}
      transform:
