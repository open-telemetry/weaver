  # --- grpc.server.call.duration ---------------------------------------------
  - id: grpc-server-call-duration
    name: grpc.server.call.duration becomes rpc.server.call.duration
    description: >
      Same instrument (histogram) and unit (s). grpc.method and grpc.status
      map to rpc.method and rpc.status_code; the values use the same format
      (full method name, status code name). rpc.system.name is always grpc.
    metric:
      matches: [{metric_field: name, equals: grpc.server.call.duration}]
      transform:
        rename:
          - {datapoint_attribute: [grpc.method], to: rpc.method}
          - {datapoint_attribute: [grpc.status], to: rpc.status_code}
        add:
          - {metric_field: name, value: rpc.server.call.duration, upsert: true}
          - {datapoint_attribute: [rpc.system.name], value: grpc}

  - id: grpc-server-call-duration-method-other
    name: grpc.method "other" becomes rpc.method "_OTHER" on grpc.server.call.duration
    description: Single-value emulation of a value map (exact).
    metric:
