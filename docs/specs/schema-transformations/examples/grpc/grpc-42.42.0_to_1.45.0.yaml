  # --- Spans ---------------------------------------------------------------
  - id: grpc-span-client-system
    name: gRPC client call spans (Sent.*) get rpc.system.name grpc
    description: >
      The span name keeps its Sent. prefix, and rpc.method / rpc.status_code
      stay unset: each needs a new op (span-name rewrite, derive from a span
      field). Target-safe: OTel span names are {rpc.method}, which never start
      with "Sent.", and add without upsert keeps an existing value.
    trace:
      matches:
        - {span_kind: client}
        - {trace_field: name, glob: "Sent.*"}
      transform:
        add: [{span_attribute: [rpc.system.name], value: grpc}]

  - id: grpc-span-server-system
    name: gRPC server spans (Recv.*) get rpc.system.name grpc
    description: Same as the client policy, for the Recv. prefix.
    trace:
      matches:
        - {span_kind: server}
        - {trace_field: name, glob: "Recv.*"}
      transform:
        add: [{span_attribute: [rpc.system.name], value: grpc}]
