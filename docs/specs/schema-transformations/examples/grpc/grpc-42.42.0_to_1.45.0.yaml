  - id: grpc-client-call-duration-error-unimplemented
    name: grpc.client.call.duration with grpc.status UNIMPLEMENTED gets error.type UNIMPLEMENTED
    metric:
      matches:
        - {metric_field: name, equals: grpc.client.call.duration}
        - {datapoint_attribute: [grpc.status], equals: UNIMPLEMENTED}
      transform:
        add: [{datapoint_attribute: [error.type], value: UNIMPLEMENTED}]
  - id: grpc-client-call-duration-error-internal
    name: grpc.client.call.duration with grpc.status INTERNAL gets error.type INTERNAL
    metric:
      matches:
        - {metric_field: name, equals: grpc.client.call.duration}
        - {datapoint_attribute: [grpc.status], equals: INTERNAL}
      transform:
