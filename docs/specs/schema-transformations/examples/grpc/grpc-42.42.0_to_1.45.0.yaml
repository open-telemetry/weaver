  # error.type := grpc.status for error codes. On the server only UNKNOWN, DEADLINE_EXCEEDED, UNIMPLEMENTED, INTERNAL, UNAVAILABLE and DATA_LOSS are errors.
  # One policy per code: there's no copy/derive op.
  - id: grpc-server-call-duration-error-unknown
    name: grpc.server.call.duration with grpc.status UNKNOWN gets error.type UNKNOWN
    metric:
      matches:
        - {metric_field: name, equals: grpc.server.call.duration}
        - {datapoint_attribute: [grpc.status], equals: UNKNOWN}
      transform:
        add: [{datapoint_attribute: [error.type], value: UNKNOWN}]
  - id: grpc-server-call-duration-error-deadline-exceeded
    name: grpc.server.call.duration with grpc.status DEADLINE_EXCEEDED gets error.type DEADLINE_EXCEEDED
    metric:
      matches:
        - {metric_field: name, equals: grpc.server.call.duration}
        - {datapoint_attribute: [grpc.status], equals: DEADLINE_EXCEEDED}
      transform:
        add: [{datapoint_attribute: [error.type], value: DEADLINE_EXCEEDED}]
  - id: grpc-server-call-duration-error-unimplemented
    name: grpc.server.call.duration with grpc.status UNIMPLEMENTED gets error.type UNIMPLEMENTED
    metric:
