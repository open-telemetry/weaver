  # =========================================================================
  # Metrics (experimental connection metrics)
  # =========================================================================
  - id: db-conn-usage
    name: db.client.connections.usage becomes db.client.connection.count
    metric:
      matches: [{metric_field: name, equals: db.client.connections.usage}]
      transform:
        rename:
          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
          - {datapoint_attribute: [state], to: db.client.connection.state}
        add:
          - {metric_field: name, value: db.client.connection.count, upsert: true}

  - id: db-conn-idle-max
    name: db.client.connections.idle.max becomes db.client.connection.idle.max
    metric:
      matches: [{metric_field: name, equals: db.client.connections.idle.max}]
      transform:
        rename:
          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
        add:
          - {metric_field: name, value: db.client.connection.idle.max, upsert: true}

  - id: db-conn-idle-min
    name: db.client.connections.idle.min becomes db.client.connection.idle.min
    metric:
      matches: [{metric_field: name, equals: db.client.connections.idle.min}]
      transform:
        rename:
          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
        add:
          - {metric_field: name, value: db.client.connection.idle.min, upsert: true}

  - id: db-conn-max
    name: db.client.connections.max becomes db.client.connection.max
    metric:
      matches: [{metric_field: name, equals: db.client.connections.max}]
      transform:
        rename:
          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
        add:
          - {metric_field: name, value: db.client.connection.max, upsert: true}

  - id: db-conn-pending-requests
    name: db.client.connections.pending_requests becomes db.client.connection.pending_requests
    metric:
      matches: [{metric_field: name, equals: db.client.connections.pending_requests}]
      transform:
        rename:
          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
        add:
          - {metric_field: name, value: db.client.connection.pending_requests, upsert: true}

  - id: db-conn-timeouts
    name: db.client.connections.timeouts becomes db.client.connection.timeouts
    metric:
      matches: [{metric_field: name, equals: db.client.connections.timeouts}]
      transform:
