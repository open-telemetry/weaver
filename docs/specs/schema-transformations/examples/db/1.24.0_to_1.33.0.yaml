          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
        add:
          - {metric_field: name, value: db.client.connection.timeouts, upsert: true}

  - id: db-conn-create-time
    name: db.client.connections.create_time (ms) becomes db.client.connection.create_time (s)
    metric:
      matches: [{metric_field: name, equals: db.client.connections.create_time}]
      transform:
        rename:
          - {datapoint_attribute: [pool.name], to: db.client.connection.pool.name}
        add:
          - {metric_field: name, value: db.client.connection.create_time, upsert: true}

  - id: db-conn-create-time-view
    name: db.client.connections.create_time unit ms -> s (view for db-conn-create-time)
    metric_view:
      matches: [{metric_field: name, equals: db.client.connections.create_time}]
      view:
        scale: [{metric_field: unit, from: ms, to: s}]

  - id: db-conn-wait-time
