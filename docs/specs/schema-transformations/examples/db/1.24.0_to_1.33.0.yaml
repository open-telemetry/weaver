# Database: pre-stability (v1.24.0) -> stable (v1.33.0), spans and metrics.
#
# Source: docs/non-normative/db-migration.md in open-telemetry/semantic-conventions.
# Target-safety: every trace policy matches on `db.system` (absent from v1.33
# DB spans, which carry `db.system.name`), and every metric policy matches on
# a metric name that v1.33 no longer uses, or on a v1.26 attribute key that
# v1.33 no longer uses. Target-shaped records are never matched.
#
# Left out (not bridgeable / not expressible):
#   - span name change (no span-name op)
#   - new stable-only attributes (db.query.summary, db.operation.batch.size,
#     db.response.status_code, db.stored_procedure.name, error.type, ...)
#   - db.client.operation.duration (no source metric)
#   - db.namespace for SQL Server named instances ({instance}|{database}
#     concatenation would need `derive`)
#   - db.instance.id -> server.address / db.namespace ("as appropriate")
file_format: transform/2.0
source:
  schema_url: https://opentelemetry.io/schemas/1.24.0
target:
  schema_url: https://opentelemetry.io/schemas/1.33.0

policies:
  # =========================================================================
  # Spans
  # =========================================================================
  - id: db-span-common
    name: DB client span attributes renamed or removed
    description: >
      Plain renames (db.statement, db.operation, the four per-system table /
      collection keys) and attributes removed from DB spans. Matching on
      db.system keeps v1.33 spans (db.system.name only) out. db.sql.table is
      only an approximate source for db.collection.name: v1.33 says not to
      capture it when parsed from the query text, so v1.24 data may carry a
      value that a v1.33 producer would omit. Clarified case-normalization
      guidance for db.operation.name / db.collection.name means values may
      differ in case between producers.
    trace:
      matches:
        - {span_attribute: [db.system], exists: true}
      transform:
        remove:
          - {span_attribute: [db.connection_string]}
          - {span_attribute: [db.user]}
          - {span_attribute: [db.instance.id]}
          - {span_attribute: [db.mssql.instance_name]}
          - {span_attribute: [network.transport]}
          - {span_attribute: [network.type]}
        rename:
          - {span_attribute: [db.statement], to: db.query.text}
          - {span_attribute: [db.operation], to: db.operation.name}
          - {span_attribute: [db.sql.table], to: db.collection.name}
          - {span_attribute: [db.cassandra.table], to: db.collection.name}
          - {span_attribute: [db.mongodb.collection], to: db.collection.name}
          - {span_attribute: [db.cosmosdb.container], to: db.collection.name}

  # --- db.name / db.redis.database_index / cluster name -> db.namespace -------
  - id: db-span-namespace
    name: db.name becomes db.namespace where the values coincide
    description: >
      Excludes redis and elasticsearch (own keys, below), postgresql and
      oracle (v1.33 qualifies the value; see db-span-namespace-qualified),
      and SQL Server spans with db.mssql.instance_name (v1.33 uses
      {instance}|{database}, which needs concatenation).
    trace:
      matches:
        - {span_attribute: [db.system], exists: true}
        - {span_attribute: [db.system], in: [redis, elasticsearch, postgresql, oracle], negate: true}
        - {span_attribute: [db.mssql.instance_name], exists: false}
      transform:
        rename:
          - {span_attribute: [db.name], to: db.namespace}

  - id: db-span-namespace-qualified
    name: db.name becomes db.namespace (database only) for postgresql and oracle
    description: >
      APPROXIMATE. v1.33 PostgreSQL uses {database}|{schema}; Oracle uses
      {instance}|{database}|{service}. Missing components are omitted, so the
      v1.24 database name equals the v1.33 value only when the producer did
      not know the other components. Filters on fully qualified values won't
      match migrated data.
    trace:
      matches:
        - {span_attribute: [db.system], in: [postgresql, oracle]}
      transform:
        rename:
          - {span_attribute: [db.name], to: db.namespace}

  - id: db-span-namespace-redis
    name: db.redis.database_index (int) becomes db.namespace (string)
    trace:
      matches:
        - {span_attribute: [db.system], equals: redis}
      transform:
        rename:
          - {span_attribute: [db.redis.database_index], to: db.namespace, convert: string}

  - id: db-span-namespace-elasticsearch
    name: db.elasticsearch.cluster.name becomes db.namespace
    description: Not in the guide's table; schema 1.27.0 renames it.
    trace:
      matches:
        - {span_attribute: [db.system], equals: elasticsearch}
      transform:
        rename:
          - {span_attribute: [db.elasticsearch.cluster.name], to: db.namespace}

  # --- db.system -> db.system.name ------------------------------------------
  - id: db-span-system-unchanged
    name: db.system becomes db.system.name for values that keep their spelling
    description: >
      Also carries the values the guide lists as "Removed" (cloudscape,
      coldfusion, edb, filemaker, firstsql, interbase, mssqlcompact,
      pervasive, pointbase, progress, sybase, vertica) unchanged as custom
      values; v1.33 producers may report these as other_sql or a custom
      value, so filters on them are best effort.
    trace:
      matches:
        - {span_attribute: [db.system], exists: true}
        - {span_attribute: [db.system], in: [adabas, cache, intersystems_cache, cosmosdb, db2, dynamodb, firebird, h2, hanadb, informix,
                                             ingres, maxdb, mssql, netezza, oracle, redshift, spanner], negate: true}
      transform:
        rename:
          - {span_attribute: [db.system], to: db.system.name}

  # One policy per renamed enum value (no `map` op). Each requires
  # db.system.name to be absent so dual-emitting producers keep their value.
  - id: db-span-system-adabas
    name: db.system=adabas becomes db.system.name=softwareag.adabas
    trace:
      matches:
        - {span_attribute: [db.system], equals: adabas}
        - {span_attribute: [db.system.name], exists: false}
      transform:
        rename: [{span_attribute: [db.system], to: db.system.name}]
        add: [{span_attribute: [db.system.name], value: softwareag.adabas, upsert: true}]

  - id: db-span-system-cache
    name: db.system=cache (alias of intersystems_cache) becomes intersystems.cache
    description: >
      The guide lists `cache` as Removed, but v1.24 defined it as the
      InterSystems Caché value (intersystems_cache did not exist yet), so the
      mapping is exact.
    trace:
      matches:
        - {span_attribute: [db.system], equals: cache}
        - {span_attribute: [db.system.name], exists: false}
      transform:
        rename: [{span_attribute: [db.system], to: db.system.name}]
        add: [{span_attribute: [db.system.name], value: intersystems.cache, upsert: true}]

  - id: db-span-system-intersystems-cache
    name: db.system=intersystems_cache becomes intersystems.cache
    description: Value introduced after v1.24 (intermediate versions only).
    trace:
      matches:
        - {span_attribute: [db.system], equals: intersystems_cache}
        - {span_attribute: [db.system.name], exists: false}
      transform:
        rename: [{span_attribute: [db.system], to: db.system.name}]
        add: [{span_attribute: [db.system.name], value: intersystems.cache, upsert: true}]

