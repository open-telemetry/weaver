    metric_view:
      matches: [{metric_field: name, equals: db.client.connections.use_time}]
      view:
        scale: [{metric_field: unit, from: ms, to: s}]

  # --- v1.26.0 intermediate shape ------------------------------------------
  # v1.26 already used the new metric names (and seconds) but attribute keys
  # db.client.connections.pool.name / db.client.connections.state; v1.27
  # renamed them again. These keys don't exist in v1.33, so the policies are
  # target-safe; they make the 1.24 -> 1.33 set cover v1.26 producers too.
  - id: db-conn-v126-count
    name: v1.26 db.client.connection.count attribute keys
    metric:
      matches: [{metric_field: name, equals: db.client.connection.count}]
      transform:
        rename:
          - {datapoint_attribute: [db.client.connections.pool.name], to: db.client.connection.pool.name}
          - {datapoint_attribute: [db.client.connections.state], to: db.client.connection.state}

  - id: db-conn-v126-idle-max
    name: v1.26 db.client.connection.idle.max pool key
    metric:
      matches: [{metric_field: name, equals: db.client.connection.idle.max}]
      transform:
        rename: [{datapoint_attribute: [db.client.connections.pool.name], to: db.client.connection.pool.name}]

  - id: db-conn-v126-idle-min
    name: v1.26 db.client.connection.idle.min pool key
    metric:
      matches: [{metric_field: name, equals: db.client.connection.idle.min}]
      transform:
        rename: [{datapoint_attribute: [db.client.connections.pool.name], to: db.client.connection.pool.name}]

  - id: db-conn-v126-max
    name: v1.26 db.client.connection.max pool key
    metric:
      matches: [{metric_field: name, equals: db.client.connection.max}]
      transform:
        rename: [{datapoint_attribute: [db.client.connections.pool.name], to: db.client.connection.pool.name}]

  - id: db-conn-v126-pending-requests
    name: v1.26 db.client.connection.pending_requests pool key
    metric:
      matches: [{metric_field: name, equals: db.client.connection.pending_requests}]
      transform:
