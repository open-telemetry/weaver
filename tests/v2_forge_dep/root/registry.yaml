file_format: definition/2
attributes:
  - key: root.attr
    type: string
    brief: An attribute defined in root.
    stability: stable
metrics:
  - name: root.metric
    brief: A metric defined in root that uses dependency attribute.
    instrument: counter
    unit: "1"
    stability: stable
    attributes:
      - ref: root.attr
      - ref: dep.port
        requirement_level: required
spans:
  - type: root.span
    kind: client
    name:
      note: Client span.
    brief: A span defined in root.
    stability: stable
    attributes:
      - ref: dep.attr
