# Whitespace control settings to simplify the definition of templates
whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

params:
  # Label a finding with its id rather than its level. The colour still comes
  # from the level. Override with `--param show_finding_id=true`.
  show_finding_id: false

templates:
  - template: live_check.txt.j2
    filter: .
    application_mode: single
