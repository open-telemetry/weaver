name: Test setup-weaver Action

on:
  pull_request:
    paths:
      - '.github/actions/setup-weaver/**'
      - '.github/workflows/test-setup-weaver-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test setup-weaver action
        uses: ./.github/actions/setup-weaver

      - name: Verify installation
        run: weaver --version
