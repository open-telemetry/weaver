name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '12 18 * * 2' # weekly at 18:12 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@0cc57aeabf2a31cf41114e7b24561f21a04e360b # v0.18.0
