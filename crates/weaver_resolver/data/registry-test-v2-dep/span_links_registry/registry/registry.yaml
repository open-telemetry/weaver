file_format: definition/2
imports:
  spans:
    - linkserver.*
spans:
  # A local span with no links; the target of the local link below.
  - type: worker.batch
    kind: internal
    name:
      note: Batch span name.
    brief: A local batch span.
    stability: stable
    requirement_level: recommended
  # A local span with two links: one to the local span above, one to an
  # imported span. The second link carries a link attribute resolved from
  # the dependency catalog; its brief override gets its own catalog entry.
  - type: worker.op
    kind: consumer
    name:
      note: Op span name.
    brief: A local op span with links.
    stability: stable
    requirement_level: recommended
    links:
      - ref: worker.batch
        brief: The batch this op belongs to.
      - ref: linkserver.produce
        attributes:
          - ref: linkserver.job.id
            requirement_level: required
            brief: job id carried on the link
            annotations:
              code_generation:
                exclude: true
span_refinements:
  # Declares no links; must inherit both links from worker.op.
  - id: refined.op
    ref: worker.op
    brief: Refined op span.
