file_format: resolved/2.0
schema_url: https://app.example.com/schemas/1.0.0
attribute_catalog:
- key: server.address
  type: string
  examples:
  - example.com
  brief: Server address.
  stability: stable
  provenance:
    source: 1
- key: server.port
  type: int
  examples:
  - 80
  - 443
  brief: Server port.
  stability: stable
  provenance:
    source: 1
registry:
  attributes: []
  attribute_groups: []
  spans: []
  metrics:
