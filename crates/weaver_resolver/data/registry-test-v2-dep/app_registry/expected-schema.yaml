    - base: 1
      requirement_level: recommended
    requirement_level: recommended
    brief: Count of app requests.
    stability: stable
  events: []
  entities: []
refinements:
  spans: []
  metrics:
  - id: app.request.count
    name: app.request.count
    instrument: counter
    unit: "{request}"
    attributes:
    - base: 0
      requirement_level: required
    - base: 1
      requirement_level: recommended
    requirement_level: recommended
    brief: Count of app requests.
    stability: stable
  events: []
  entities: []
dependencies:
- https://consumer.example.com/schemas/1.0.0
