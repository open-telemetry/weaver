file_format: resolved/2.0
schema_url: https://v1-dep-consumer.example.com/schemas/1.0.0
attribute_catalog:
- key: auction.id
  type: int
  brief: |
    The id of the auction.
  stability: stable
  provenance:
    source: 0
- key: auction.name
  type: string
  examples:
  - Fish for sale
  brief: Refined auction name
  stability: stable
  provenance:
    source: 0
- key: error.type
  type: string
  examples: Ex
  brief: The error type.
  stability: stable
  provenance:
    source: 1
registry:
  attributes: []
  attribute_groups: []
  spans: []
  metrics: []
  events: []
  entities: []
refinements:
  spans: []
  metrics:
  - id: refined.bid.count
    name: auction.bid.count
    instrument: counter
    unit: '{bid}'
    attributes:
    - base: 0
      requirement_level: required
    - base: 1
      requirement_level: recommended
    - base: 2
      requirement_level: required
    brief: Refined count of bids
    stability: stable
  events: []
  entities: []
dependencies:
- https://acme.com/schemas/0.1.0
- https://opentelemetry.io/schemas/1.30.0
