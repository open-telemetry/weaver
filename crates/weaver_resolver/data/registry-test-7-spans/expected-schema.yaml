  - products
  brief: |
    The MongoDB collection being accessed within the database stated in `db.name`.
  stability: stable
- key: db.mssql.instance_name
  type: string
  examples: MSSQLSERVER
  brief: |
    The Microsoft SQL Server [instance name](https://docs.microsoft.com/sql/connect/jdbc/building-the-connection-url?view=sql-server-ver15) connecting to. This name is used to determine the port of a named instance.
  note: |
    If setting a `db.mssql.instance_name`, `server.port` is no longer required (but still recommended if non-standard).
  stability: stable
- key: db.name
  type: string
  examples:
  - customers
  - main
  brief: |
    This attribute is used to report the name of the database being accessed. For commands that switch the database, this should be set to the target database (even if the command fails).
  note: |
    In some SQL databases, the database name to be used is called "schema name". In case there are multiple layers that could be considered for database name (e.g. Oracle instance name and schema name), the database name to be used is the more specific layer (e.g. Oracle schema name).
  stability: stable
- key: db.name
  type: string
  examples:
  - mykeyspace
  brief: |
    The keyspace name in Cassandra.
  note: For Cassandra the `db.name` should be set to the Cassandra keyspace name.
  stability: stable
- key: db.name
  type: string
  examples:
  - mynamespace
  brief: |
    The HBase namespace.
  note: For HBase the `db.name` should be set to the HBase namespace.
  stability: stable
- key: db.operation
  type: string
  examples:
  - GET /{db}/{docid}
  brief: |
    The HTTP method + the target REST route.
  note: |
    In **CouchDB**, `db.operation` should be set to the HTTP method + the target REST route according to the API reference documentation. For example, when retrieving a document, `db.operation` would be set to (literally, i.e., without replacing the placeholders with concrete values): [`GET /{db}/{docid}`](http://docs.couchdb.org/en/stable/api/document/common.html#get--db-docid).
  stability: stable
- key: db.operation
  type: string
  examples:
  - findAndModify
  - HMSET
  - SELECT
  brief: |
    The name of the operation being executed, e.g. the [MongoDB command name](https://docs.mongodb.com/manual/reference/command/#database-operations) such as `findAndModify`, or the SQL keyword.
  note: |
    When setting this to an SQL keyword, it is not recommended to attempt any client-side parsing of `db.statement` just to get this property, but it should be set if the operation name is provided by the library being instrumented. If the SQL statement has an ambiguous operation, or performs more than one operation, this value may be omitted.
  stability: stable
- key: db.operation
  type: string
  examples:
  - search
  - ml.close_job
  - cat.aliases
  brief: The endpoint identifier for the request.
  note: |
    When setting this to an SQL keyword, it is not recommended to attempt any client-side parsing of `db.statement` just to get this property, but it should be set if the operation name is provided by the library being instrumented. If the SQL statement has an ambiguous operation, or performs more than one operation, this value may be omitted.
  stability: stable
