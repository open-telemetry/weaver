file_format: definition/2
attributes:
  - key: base.host.id
    type: string
    stability: stable
    brief: Unique host ID, defined in base.
    examples: ["abc123"]
metrics:
  - name: base.uptime
    brief: Uptime metric defined in base.
    instrument: gauge
    unit: "s"
    stability: stable
    attributes:
      - ref: base.host.id
