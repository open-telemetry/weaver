groups:
  # The legacy spelling, as published registries still carry it. The group is an
  # entity, its type is `browser`, and it has no `name`.
  - id: browser
    type: resource
    stability: stable
    brief: The web browser in which the application is running.
    attributes:
      - id: browser.brands
        type: string[]
        stability: stable
        brief: Array of brand name and version separated by a space.
        examples: [["Not A;Brand 99"], ["Chromium 99"]]

  - id: metric.legacy.request.count
    type: metric
    metric_name: legacy.request.count
    instrument: counter
    unit: "{request}"
    stability: stable
    brief: Count of requests.
    entity_associations:
      - browser

  # The other legacy spelling, which every `resource` group of semconv v1.33.0
  # uses: the id carries a `resource.` prefix and `name` holds the entity type.
  - id: resource.device
    type: resource
    name: device
    stability: stable
    brief: The device on which the application runs.
    attributes:
      - id: device.id
        type: string
        stability: stable
        brief: A unique identifier for the device.
        examples: ["2ab2916d-a51f-4ac8-80ee-45ac31a28092"]

  - id: metric.legacy.device.count
    type: metric
    metric_name: legacy.device.count
    instrument: counter
    unit: "{device}"
    stability: stable
    brief: Count of devices.
    # The entity type is the `name` of the group, not its id.
    entity_associations:
      - device
