name: top_rival
description: >
  Depends on two unrelated registries that each define their own `host` entity,
  and imports `host` from both.
schema_url: https://example.com/top-rival/1.0.0
dependencies:
  - name: base
    schema_url: https://example.com/base/1.0.0
    registry_path: data/entity-assoc-imports/base
  - name: rival
    schema_url: https://rival.example.com/rival/1.0.0
    registry_path: data/entity-assoc-imports/rival_base
