- key: http.route
  type: string
  examples:
  - /users/:userID?
  - "{controller}/{action}/{id?}"
  brief: |
    The matched route, that is, the path template in the format used by the respective server framework.
  note: |
    MUST NOT be populated when this is not supported by the HTTP server framework as the route attribute should have low-cardinality and the URI path can NOT substitute it.
    SHOULD include the [application root](/docs/http/http-spans.md#http-server-definitions) if there is one.
  stability: stable
- key: messaging.batch.message_count
  type: int
  examples:
  - 0
  - 1
  - 2
  brief: >-
    The number of messages sent, received, or processed in the scope of the
    batching operation.
  note: |
    Instrumentations SHOULD NOT set `messaging.batch.message_count` on spans that operate with a single message. When a messaging client library supports both batch and single-message API for the same operation, instrumentations SHOULD use `messaging.batch.message_count` for batching APIs and SHOULD NOT use it for single-message APIs.
  stability: stable
- key: messaging.client_id
  type: string
  examples:
  - client-5
  - myhost@8742@s8083jm
  brief: |
    A unique identifier for the client that consumes or produces a message.
  stability: stable
- key: messaging.destination.anonymous
  type: boolean
  brief: >-
    A boolean that is true if the message destination is anonymous (could be
    unnamed or have auto-generated name).
  stability: stable
- key: messaging.destination.name
  type: string
  examples:
  - MyQueue
  - MyTopic
  brief: The message destination name
  note: |
    Destination name SHOULD uniquely identify a specific queue, topic or other entity within the broker. If
    the broker doesn't have such notion, the destination name SHOULD uniquely identify the broker.
  stability: stable
- key: messaging.destination.template
  type: string
  examples:
  - /customers/{customerId}
  brief: Low cardinality representation of the messaging destination name
  note: |
    Destination names could be constructed from templates. An example would be a destination name involving a user name or product id. Although the destination name in this case is of high cardinality, the underlying template is of low cardinality and can be effectively used for grouping and aggregation.
  stability: stable
- key: messaging.destination.temporary
  type: boolean
  brief: >-
    A boolean that is true if the message destination is temporary and might not
    exist anymore after messages are processed.
  stability: stable
- key: messaging.destination_publish.anonymous
  type: boolean
  brief: >-
    A boolean that is true if the publish message destination is anonymous (could
    be unnamed or have auto-generated name).
  stability: stable
- key: messaging.destination_publish.name
  type: string
  examples:
  - MyQueue
  - MyTopic
  brief: The name of the original destination the message was published to
  note: |
    The name SHOULD uniquely identify a specific queue, topic, or other entity within the broker. If
    the broker doesn't have such notion, the original destination name SHOULD uniquely identify the broker.
  stability: stable
