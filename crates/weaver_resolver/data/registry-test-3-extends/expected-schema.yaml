  type: string
  examples:
  - SemConv
  brief: The [URI fragment](https://www.rfc-editor.org/rfc/rfc3986#section-3.5) component
  stability: stable
- key: url.full
  type: string
  examples:
  - https://www.foo.bar/search?q=OpenTelemetry#SemConv
  - //localhost
  brief: >-
    Absolute URL describing a network resource according to
    [RFC3986](https://www.rfc-editor.org/rfc/rfc3986)
  note: |
    For network calls, URL usually has `scheme://host[:port][path][?query][#fragment]` format, where the fragment is not transmitted over HTTP, but if it is known, it SHOULD be included nevertheless.
    `url.full` MUST NOT contain credentials passed via URL in form of `https://username:password@www.example.com/`. In such case username and password SHOULD be redacted and attribute's value SHOULD be `https://REDACTED:REDACTED@www.example.com/`.
    `url.full` SHOULD capture the absolute URL when it is available (or can be reconstructed) and SHOULD NOT be validated or modified except for sanitizing purposes.
  stability: stable
- key: url.path
  type: string
  examples:
  - /search
  brief: The [URI path](https://www.rfc-editor.org/rfc/rfc3986#section-3.3) component
  stability: stable
- key: url.query
  type: string
  examples:
  - q=OpenTelemetry
  brief: The [URI query](https://www.rfc-editor.org/rfc/rfc3986#section-3.4) component
  note: >-
    Sensitive content provided in query string SHOULD be scrubbed when
    instrumentations can identify it.
  stability: stable
- key: url.scheme
  type: string
  examples:
  - http
  - https
  brief: >-
    The [URI scheme](https://www.rfc-editor.org/rfc/rfc3986#section-3.1) component
    identifying the used protocol.
  stability: stable
- key: url.scheme
  type: string
  examples:
  - http
  - https
  brief: >-
    The [URI scheme](https://www.rfc-editor.org/rfc/rfc3986#section-3.1) component
    identifying the used protocol.
  note: |
    The scheme of the original client request, if known (e.g. from [Forwarded#proto](https://developer.mozilla.org/docs/Web/HTTP/Headers/Forwarded#proto), [X-Forwarded-Proto](https://developer.mozilla.org/docs/Web/HTTP/Headers/X-Forwarded-Proto), or a similar header). Otherwise, the scheme of the immediate peer request.
  stability: stable
- key: url.scheme
  type: string
  examples:
