# The checkout matcher again. The signal and the signature have not changed.
# All the group says is that the attributes in `myapp.common` are expected on
# this span too.
[[live-check.matchers]]
id = "myapp.checkout"
sample_type = "span"
when = '''
"myapp.checkout.id" in attributes
  && "myapp.checkout.stage" in attributes
  && attributes["myapp.checkout.stage"].matches("^(cart|payment|confirm)$")
'''
signal = "myapp.checkout"
attribute_groups = ["myapp.common"]
