# The span matcher from the live-check v2 semconv plan. The signature is
# `myapp.checkout.id` being present, together with `myapp.checkout.stage`
# holding one of the values we expect.
[[live-check.matchers]]
id = "myapp.checkout"
sample_type = "span"
when = '''
"myapp.checkout.id" in attributes
  && "myapp.checkout.stage" in attributes
  && attributes["myapp.checkout.stage"].matches("^(cart|payment|confirm)$")
'''
signal = "myapp.checkout"
