# yaml-language-server: $schema=../../../../../schemas/semconv.schema.v2.json
file_format: definition/2

attributes:
  - key: acme.tenant.id
    type: string
    brief: Identifier of the tenant the telemetry belongs to.
    stability: stable
    examples: ["t-42"]

  - key: acme.tenant.tag
    type: template[string]
    brief: Tags the tenant applies to its telemetry.
    stability: stable
    examples: ["eu-west"]
